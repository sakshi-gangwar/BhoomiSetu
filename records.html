<main class="max-w-7xl mx-auto p-6">

<div class="bg-white rounded-xl shadow border overflow-hidden">


<div class="p-5 border-b">

<h1 class="text-2xl font-bold text-[#0d233a]">
Authenticated Land Records
</h1>

<p class="text-sm text-slate-500">
Records synchronized from the land database.
</p>

</div>


<div class="overflow-x-auto">

<table class="w-full text-sm">

<thead class="bg-slate-100">

<tr>

<th class="p-4 text-left">
Owner
</th>

<th class="p-4 text-left">
Khasra
</th>

<th class="p-4 text-left">
Village
</th>

<th class="p-4 text-left">
District
</th>

<th class="p-4 text-left">
Area
</th>

<th class="p-4 text-left">
Status
</th>

</tr>

</thead>


<tbody id="recordsTableBody">

<tr>

<td colspan="6"
    class="text-center p-8">

Loading records...

</td>

</tr>

</tbody>

</table>

</div>

</div>

</main>


<script>

/* BhoomiSetu Backend */
const API_BASE = "http://127.0.0.1:8000";


async function loadRecords() {

    const tbody =
        document.getElementById("recordsTableBody");

    try {

        const response =
            await fetch(`${API_BASE}/api/records`);

        if (!response.ok) {
            throw new Error(
                "Backend returned HTTP " + response.status
            );
        }

        const data =
            await response.json();

        const records =
            data.records || [];

        tbody.innerHTML = "";


        if (records.length === 0) {

            tbody.innerHTML = `

                <tr>

                    <td colspan="6"
                        class="text-center p-8 text-slate-400">

                        No records found.

                    </td>

                </tr>

            `;

            return;
        }


        records.forEach(record => {

            const row =
                document.createElement("tr");

            row.className =
                "border-t hover:bg-slate-50";


            const status =
                record.status === "VALIDATED"
                ? "VALIDATED"
                : "FLAGGED";


            const statusHTML =
                status === "VALIDATED"

                ?

                `<span class="bg-green-100
                text-green-700 px-2 py-1 rounded font-semibold">
                VALIDATED
                </span>`

                :

                `<span class="bg-red-100
                text-red-700 px-2 py-1 rounded font-semibold">
                FLAGGED
                </span>`;


            row.innerHTML = `

                <td class="p-4 font-semibold">
                    ${record.owner_name || "-"}
                </td>

                <td class="p-4">
                    ${record.khasra_no || "-"}
                </td>

                <td class="p-4">
                    ${record.village || "-"}
                </td>

                <td class="p-4">
                    ${record.district || "-"}
                </td>

                <td class="p-4">
                    ${record.area_acres ?? "-"} Acres
                </td>

                <td class="p-4">
                    ${statusHTML}
                </td>

            `;


            tbody.appendChild(row);

        });


    } catch(error) {

        console.error(
            "BhoomiSetu Backend Error:",
            error
        );


        tbody.innerHTML = `

            <tr>

                <td colspan="6"
                    class="text-center p-8 text-red-600">

                    <div class="font-semibold">
                        Backend connection failed.
                    </div>

                    <div class="text-xs text-slate-500 mt-2">
                        Please make sure the FastAPI server is running on port 8000.
                    </div>

                </td>

            </tr>

        `;

    }

}


/* Load records when page opens */
loadRecords();

</script>


</body>
